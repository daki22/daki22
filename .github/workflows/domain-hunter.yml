name: domain-hunter
on:
  schedule:
    - cron: "17 5 * * *"   # daily
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency: domain-hunter
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "domain-hunter"
          git config user.email "domain-hunter@users.noreply.github.com"
      - name: Hunt (pushes progress as it finds domains)
        env:
          DOMAIN_HUNTER_PUSH: "1"
        run: python3 domain-hunter/hunter.py
      - name: Job summary
        run: cat domain-hunter/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "domain-hunter"
          git config user.email "domain-hunter@users.noreply.github.com"
          git add domain-hunter/results.md domain-hunter/results.csv domain-hunter/cache.json
          git commit -m "domain-hunter: update results" || exit 0
          git pull --rebase -q && git push
      - name: Notify (phone push via GitHub issue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '^1\.' domain-hunter/top_new.md; then
            gh issue create --title "New free domains $(date -u +%F)" \
              --body "$(cat domain-hunter/top_new.md)

          Full list: domain-hunter/results.md"
          fi
